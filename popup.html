<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --text: #222;
        --muted: #666;
        --border: #e0e0e0;
        --chip-bg: #f5f5f5;
        --chip-hover: #ebebeb;
        --chip-border: #ccc;
        --active-bg: #1a1a1a;
        --active-text: #fff;
        --site-color: #666;
        --warn-bg: #fff7cc;
        --warn-border: #e8d77a;
        --warn-border-strong: #b8a44a;
        --link: #444;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1f1f;
          --text: #e6e6e6;
          --muted: #9a9a9a;
          --border: #2e2e2e;
          --chip-bg: #2a2a2a;
          --chip-hover: #333;
          --chip-border: #3a3a3a;
          --active-bg: #e6e6e6;
          --active-text: #1a1a1a;
          --site-color: #999;
          --warn-bg: #3a3320;
          --warn-border: #6b5f2e;
          --warn-border-strong: #8a7a3e;
          --link: #c5c5c5;
        }
      }
      body {
        font: 13px system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 240px;
        background: var(--bg);
        color: var(--text);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 10px;
        margin: 12px 0 4px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .row {
        display: flex;
        gap: 4px;
      }
      .row button {
        flex: 1;
        padding: 6px 0;
        font: inherit;
        background: var(--chip-bg);
        color: var(--text);
        border: 1px solid var(--chip-border);
        border-radius: 4px;
        cursor: pointer;
      }
      .row button:hover {
        background: var(--chip-hover);
      }
      .row button.active {
        background: var(--active-bg);
        color: var(--active-text);
        border-color: var(--active-bg);
      }
      .site {
        font-size: 11px;
        color: var(--site-color);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pause-status {
        font-size: 11px;
        margin: 4px 0;
        padding: 6px 8px;
        background: var(--warn-bg);
        border: 1px solid var(--warn-border);
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }
      .pause-status button {
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--warn-border-strong);
        border-radius: 3px;
        padding: 2px 6px;
        cursor: pointer;
      }
      .note {
        font-size: 11px;
        color: var(--muted);
        margin: 4px 0;
        font-style: italic;
      }
      .footer {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        font-size: 11px;
      }
      .footer a {
        color: var(--link);
        text-decoration: none;
        cursor: pointer;
      }
      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Silenzio</h1>
    <div class="site" id="site"></div>

    <h2>Videos</h2>
    <div class="row" data-target="video">
      <button data-mode="off">Off</button>
      <button data-mode="blur">Blur</button>
      <button data-mode="blackout">Blackout</button>
    </div>

    <h2>Images</h2>
    <div class="row" data-target="image">
      <button data-mode="off">Off</button>
      <button data-mode="blur">Blur</button>
      <button data-mode="blackout">Blackout</button>
    </div>

    <h2>Pause this site</h2>
    <div id="pause-controls" class="row">
      <button data-pause="5">5 min</button>
      <button data-pause="10">10 min</button>
      <button data-pause="30">30 min</button>
    </div>
    <div id="pause-status" class="pause-status" hidden>
      <span id="pause-text"></span>
      <button id="resume">Resume</button>
    </div>

    <div id="notes"></div>

    <div class="footer">
      <a id="open-options">Settings →</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
